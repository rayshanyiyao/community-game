<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社区护理评估方法配对竞赛</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js">
    </script>
    <style>
        :root {
            --primary: #3A7D8C;
            --primary-light: #E8F4F7;
            --primary-dark: #2C5F6B;
            --success: #4CAF84;
            --success-light: #E6F7EE;
            --error: #E0556A;
            --error-light: #FDE8EB;
            --warning: #F0A04B;
            --draft: #7C5CBF;
            --draft-light: #F3EEFA;
            --bg: #F5F2EE;
            --card-bg: #FFFFFF;
            --text: #2D3436;
            --text-secondary: #5F6B6E;
            --border: #E0DCD5;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 6px 24px rgba(0, 0, 0, 0.10);
            --radius: 14px;
            --radius-sm: 10px;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 16px;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.07);
            padding: 24px 20px 28px;
            position: relative;
            overflow: hidden;
        }
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #3A7D8C, #5BA4B5, #4CAF84, #7EC8A0);
            border-radius: 20px 20px 0 0;
        }
        .header {
            text-align: center;
            padding: 10px 0 6px;
            margin-bottom: 6px;
        }
        .header .icon-row {
            font-size: 40px;
            margin-bottom: 4px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-8px);
            }
        }
        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-dark);
            letter-spacing: 0.5px;
            margin: 0;
            line-height: 1.3;
        }
        .header .subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 2px;
            letter-spacing: 0.3px;
        }
        .info-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
            padding: 8px 12px;
            margin-bottom: 14px;
            background: var(--primary-light);
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .info-bar .info-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--primary-dark);
            white-space: nowrap;
        }
        .info-bar .info-item .emoji {
            font-size: 1.2rem;
        }
        .info-bar .score-val {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--primary);
            min-width: 28px;
            text-align: center;
            transition: transform 0.3s;
        }
        .info-bar .score-val.pulse {
            animation: scorePulse 0.4s ease-out;
        }
        @keyframes scorePulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.5);
                color: var(--success);
            }
        }
        .game-area {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap;
            position: relative;
        }
        .column {
            flex: 1;
            min-width: 240px;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .column-label {
            text-align: center;
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--primary-dark);
            letter-spacing: 0.5px;
            padding: 6px 12px;
            background: var(--primary-light);
            border-radius: 20px;
            margin-bottom: 2px;
        }
        .column-label .label-icon {
            margin-right: 4px;
        }
        .card {
            background: var(--card-bg);
            border: 2.5px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            cursor: pointer;
            transition: all var(--transition);
            position: relative;
            font-size: 0.92rem;
            line-height: 1.45;
            letter-spacing: 0.3px;
            color: var(--text);
            text-align: center;
            min-height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.03);
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }
        .card:hover {
            border-color: #bcc7ca;
            box-shadow: var(--shadow-hover);
            transform: translateY(-1px);
        }
        .card:active {
            transform: scale(0.97);
            transition: transform 0.1s;
        }
        .left-card {
            border-left: 4px solid var(--primary);
            border-radius: var(--radius-sm);
            text-align: left;
            padding-left: 14px;
        }
        .right-card {
            border-right: 4px solid var(--warning);
            border-radius: var(--radius-sm);
        }
        .card.selected {
            border-color: var(--primary) !important;
            background: #E3F0F4 !important;
            box-shadow: 0 0 0 6px rgba(58, 125, 140, 0.13);
            transform: translateY(-2px);
            font-weight: 600;
            animation: selectedGlow 1.5s ease-in-out infinite;
        }
        @keyframes selectedGlow {
            0%,
            100% {
                box-shadow: 0 0 0 6px rgba(58, 125, 140, 0.13);
            }
            50% {
                box-shadow: 0 0 0 12px rgba(58, 125, 140, 0.06);
            }
        }
        /* 暂存配对状态 */
        .card.draft-paired {
            border-color: var(--draft) !important;
            background: var(--draft-light) !important;
            font-weight: 600;
            box-shadow: 0 0 0 5px rgba(124, 92, 191, 0.10);
        }
        .card.draft-paired::after {
            content: ' 🔗';
            color: var(--draft);
            font-weight: 700;
            font-size: 0.9rem;
        }
        .draft-number {
            display: inline-block;
            background: var(--draft);
            color: #fff;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            line-height: 24px;
            text-align: center;
            font-size: 0.75rem;
            font-weight: 700;
            margin-right: 6px;
            flex-shrink: 0;
        }
        /* 提交后正确 */
        .card.matched {
            border-color: var(--success) !important;
            background: var(--success-light) !important;
            cursor: default;
            pointer-events: none;
            font-weight: 600;
            box-shadow: 0 2px 10px rgba(76, 175, 132, 0.18);
            animation: matchBounce 0.5s ease-out;
        }
        @keyframes matchBounce {
            0% {
                transform: scale(1);
            }
            30% {
                transform: scale(1.06);
            }
            60% {
                transform: scale(0.97);
            }
            100% {
                transform: scale(1);
            }
        }
        .card.matched::after {
            content: ' ✓';
            color: var(--success);
            font-weight: 700;
            font-size: 1.1rem;
        }
        .match-number {
            display: inline-block;
            background: var(--success);
            color: #fff;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            line-height: 24px;
            text-align: center;
            font-size: 0.75rem;
            font-weight: 700;
            margin-right: 6px;
            flex-shrink: 0;
        }
        /* 提交后错误 */
        .card.incorrect {
            border-color: var(--error) !important;
            background: var(--error-light) !important;
            cursor: default;
            pointer-events: none;
            font-weight: 600;
            box-shadow: 0 2px 10px rgba(224, 85, 106, 0.18);
            animation: wrongShake 0.6s ease-out;
        }
        @keyframes wrongShake {
            0%,
            100% {
                transform: translateX(0);
            }
            15% {
                transform: translateX(-8px);
            }
            30% {
                transform: translateX(8px);
            }
            45% {
                transform: translateX(-5px);
            }
            60% {
                transform: translateX(5px);
            }
            75% {
                transform: translateX(-2px);
            }
            90% {
                transform: translateX(2px);
            }
        }
        .card.incorrect::after {
            content: ' ✗';
            color: var(--error);
            font-weight: 700;
            font-size: 1.1rem;
        }
        /* 提交按钮 */
        .btn-submit {
            background: var(--draft) !important;
            color: #fff !important;
            border-color: var(--draft) !important;
            font-size: 1rem !important;
            padding: 12px 28px !important;
            letter-spacing: 0.5px;
            transition: all var(--transition);
            cursor: pointer;
        }
        .btn-submit:hover:not(:disabled) {
            background: #6A4DAD !important;
            border-color: #6A4DAD !important;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(124, 92, 191, 0.3);
        }
        .btn-submit:disabled {
            background: #C4B5DB !important;
            border-color: #C4B5DB !important;
            cursor: not-allowed;
            opacity: 0.7;
        }
        .completion-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .completion-overlay.show {
            display: flex;
        }
        .completion-modal {
            background: #fff;
            border-radius: 20px;
            padding: 28px 22px 22px;
            text-align: center;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            animation: modalIn 0.4s ease-out;
        }
        @keyframes modalIn {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .completion-modal .trophy {
            font-size: 64px;
            animation: float 2s ease-in-out infinite;
        }
        .completion-modal h2 {
            font-size: 1.4rem;
            margin: 8px 0;
            color: var(--primary-dark);
        }
        .completion-modal .stats {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin: 14px 0;
            flex-wrap: wrap;
        }
        .completion-modal .stat-item {
            text-align: center;
        }
        .completion-modal .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
        }
        .completion-modal .stat-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        .completion-modal .badge-name {
            display: inline-block;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #5C3D00;
            padding: 6px 18px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.95rem;
            margin: 6px 0 10px;
        }
        .completion-modal button {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 12px 28px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: all var(--transition);
            margin: 6px;
        }
        .completion-modal button:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(44, 95, 107, 0.3);
        }
        .completion-modal button.secondary {
            background: #fff;
            color: var(--primary);
            border: 2px solid var(--primary);
        }
        .completion-modal button.secondary:hover {
            background: var(--primary-light);
        }
        .btn-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 16px;
            flex-wrap: wrap;
            align-items: center;
        }
        .btn {
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.4px;
            transition: all var(--transition);
            border: 2px solid transparent;
            text-align: center;
            white-space: nowrap;
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        .btn-primary:hover {
            background: var(--primary-dark);
            border-color: var(--primary-dark);
            box-shadow: 0 4px 16px rgba(44, 95, 107, 0.25);
            transform: translateY(-1px);
        }
        .btn-outline {
            background: #fff;
            color: var(--primary);
            border-color: var(--primary);
        }
        .btn-outline:hover {
            background: var(--primary-light);
            transform: translateY(-1px);
        }
        .hint-text {
            text-align: center;
            font-size: 0.82rem;
            color: var(--text-secondary);
            margin-top: 8px;
            letter-spacing: 0.3px;
            animation: fadeHint 2.5s ease-in-out infinite;
        }
        @keyframes fadeHint {
            0%,
            100% {
                opacity: 0.6;
            }
            50% {
                opacity: 1;
            }
        }
        .qr-section {
            margin-top: 20px;
            padding: 16px 14px;
            background: #FAFAF8;
            border-radius: var(--radius);
            border: 1.5px dashed var(--border);
            text-align: center;
        }
        .qr-section h3 {
            font-size: 0.95rem;
            color: var(--primary-dark);
            margin-bottom: 6px;
        }
        .qr-section .qr-subtitle {
            font-size: 0.78rem;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }
        .qr-container {
            display: inline-block;
            background: #fff;
            padding: 12px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            margin: 0 auto;
        }
        .qr-container canvas {
            display: block;
        }
        .qr-url-input {
            width: 100%;
            max-width: 360px;
            padding: 10px 14px;
            border: 2px solid var(--border);
            border-radius: 25px;
            font-size: 0.85rem;
            text-align: center;
            color: var(--text);
            transition: all var(--transition);
            margin-top: 8px;
            background: #fff;
        }
        .qr-url-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(58, 125, 140, 0.08);
        }
        .qr-note {
            font-size: 0.73rem;
            color: var(--text-secondary);
            margin-top: 6px;
        }
        .qr-note.warning {
            color: var(--error);
            font-weight: 500;
        }
        @media (max-width: 600px) {
            .container {
                padding: 16px 10px 20px;
                border-radius: 16px;
            }
            .container::before {
                border-radius: 16px 16px 0 0;
                height: 4px;
            }
            .header h1 {
                font-size: 1.2rem;
            }
            .header .icon-row {
                font-size: 32px;
            }
            .game-area {
                flex-direction: column;
                gap: 14px;
                align-items: stretch;
            }
            .column {
                min-width: auto;
                max-width: none;
                gap: 7px;
            }
            .card {
                font-size: 0.84rem;
                padding: 12px 14px;
                min-height: 46px;
                border-radius: 8px;
            }
            .left-card {
                border-left-width: 3px;
            }
            .right-card {
                border-right-width: 3px;
            }
            .info-bar {
                gap: 10px;
                font-size: 0.78rem;
                padding: 6px 10px;
                border-radius: 22px;
            }
            .btn {
                padding: 8px 16px;
                font-size: 0.82rem;
            }
            .btn-submit {
                padding: 10px 20px !important;
                font-size: 0.9rem !important;
            }
            .completion-modal {
                padding: 20px 14px 16px;
                border-radius: 16px;
            }
            .completion-modal .trophy {
                font-size: 48px;
            }
            .completion-modal h2 {
                font-size: 1.2rem;
            }
            .completion-modal .stat-value {
                font-size: 1.5rem;
            }
            .qr-url-input {
                max-width: 100%;
                font-size: 0.8rem;
                padding: 8px 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="icon-row">🔍🩺</div>
            <h1>社区护理评估方法配对竞赛</h1>
            <p class="subtitle">请将左侧的评估情境与右侧的适宜方法进行配对，完成后点击提交</p>
        </div>
        <div class="info-bar">
            <span class="info-item"><span class="emoji">⏱️</span> <span id="timer">00:00</span></span>
            <span class="info-item"><span class="emoji">⭐</span> 得分：<span class="score-val" id="score">0</span></span>
            <span class="info-item"><span class="emoji">🔗</span> 已连：<span id="draftCount">0</span>/5</span>
        </div>
        <div class="game-area">
            <div class="column" id="leftColumn">
                <div class="column-label"><span class="label-icon">📋</span>评估情境</div>
            </div>
            <div class="column" id="rightColumn">
                <div class="column-label"><span class="label-icon">🔧</span>适宜方法</div>
            </div>
        </div>
        <p class="hint-text" id="hintText">💡 先点击左侧情境卡片，再点击右侧方法卡片进行连线（提交前可随时修改）</p>
        <div class="btn-row">
            <button class="btn btn-outline" onclick="resetGame()">🔄 重新开始</button>
            <button class="btn btn-submit" id="submitBtn" onclick="submitAnswers()" disabled>📝 提交答案</button>
            <button class="btn btn-outline" onclick="showAllAnswers()">👁️ 查看答案</button>
        </div>
        <div class="qr-section" id="qrSection">
            <h3>📱 扫码在手机上打开</h3>
            <p class="qr-subtitle">将本页面部署后，扫描二维码即可在手机上参与游戏</p>
            <div class="qr-container" id="qrContainer">
                <p style="color:#999; font-size:0.85rem; padding:20px;">正在生成二维码...</p>
            </div>
            <input type="text" class="qr-url-input" id="qrUrlInput" placeholder="输入部署后的URL地址（如 https://...）" onchange="updateQRCode()" />
            <p class="qr-note" id="qrNote">💡 部署后自动使用当前页面地址生成二维码</p>
        </div>
    </div>
    <div class="completion-overlay" id="completionOverlay">
        <div class="completion-modal">
            <div class="trophy" id="trophyEmoji">🏆</div>
            <h2 id="completionTitle">太棒了！</h2>
            <div class="badge-name" id="badgeName">社区最佳侦探</div>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="finalScore">100</div>
                    <div class="stat-label">得分</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="finalTime">00:00</div>
                    <div class="stat-label">用时</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="finalCorrect">5/5</div>
                    <div class="stat-label">正确数</div>
                </div>
            </div>
            <button onclick="resetGame()">🔄 再来一次</button>
            <button class="secondary" onclick="closeCompletion()">✕ 关闭</button>
        </div>
    </div>

    <script>
        (function() {
            const leftItemsData = [
                { id: 'L1', text: '社区护士想系统了解社区环境状况' },
                { id: 'L2', text: '想了解居民的饮食习惯' },
                { id: 'L3', text: '想知道高血压患病率是否偏高' },
                { id: 'L4', text: '想深入了解社区的发展和特点' },
                { id: 'L5', text: '想知道社区居民对社区健康问题的看法' }
            ];
            const rightItemsData = [
                { id: 'R1', text: '挡风玻璃调查' },
                { id: 'R2', text: '问卷调查' },
                { id: 'R3', text: '查阅文献资料' },
                { id: 'R4', text: '重点人物访谈' },
                { id: 'R5', text: '社区讨论' }
            ];
            const correctMap = { 'L1': 'R1', 'L2': 'R2', 'L3': 'R3', 'L4': 'R4', 'L5': 'R5' };

            function shuffleArray(arr) {
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }

            function renderShuffledColumns() {
                const leftCol = document.getElementById('leftColumn');
                const rightCol = document.getElementById('rightColumn');
                leftCol.querySelectorAll('.card').forEach(c => c.remove());
                rightCol.querySelectorAll('.card').forEach(c => c.remove());
                const shuffledLeft = shuffleArray([...leftItemsData]);
                const shuffledRight = shuffleArray([...rightItemsData]);
                shuffledLeft.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card left-card';
                    card.dataset.id = item.id;
                    card.textContent = item.text;
                    leftCol.appendChild(card);
                });
                shuffledRight.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card right-card';
                    card.dataset.id = item.id;
                    card.textContent = item.text;
                    rightCol.appendChild(card);
                });
                bindCardEvents();
            }

            // ---------- 游戏状态 ----------
            let selectedLeft = null;
            let draftPairs = {}; // { leftId: rightId }
            let draftRightToLeft = {}; // { rightId: leftId }
            let matchedPairs = {};
            let matchedRightIds = new Set();
            let score = 0;
            let correctCount = 0;
            let timerSeconds = 0;
            let timerInterval = null;
            let gameStarted = false;
            let gameCompleted = false;
            let draftCounter = 0;

            const timerEl = document.getElementById('timer');
            const scoreEl = document.getElementById('score');
            const draftCountEl = document.getElementById('draftCount');
            const hintText = document.getElementById('hintText');
            const submitBtn = document.getElementById('submitBtn');
            const completionOverlay = document.getElementById('completionOverlay');

            function formatTime(sec) {
                const m = Math.floor(sec / 60);
                const s = sec % 60;
                return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
            }

            function startTimer() {
                if (gameStarted) return;
                gameStarted = true;
                timerInterval = setInterval(() => {
                    timerSeconds++;
                    timerEl.textContent = formatTime(timerSeconds);
                }, 1000);
            }

            function stopTimer() {
                clearInterval(timerInterval);
                timerInterval = null;
            }

            function getDraftCount() {
                return Object.keys(draftPairs).length;
            }

            function updateSubmitBtn() {
                const count = getDraftCount();
                draftCountEl.textContent = count;
                if (gameCompleted) {
                    submitBtn.disabled = true;
                    submitBtn.textContent = '📝 已提交';
                } else if (count === 5) {
                    submitBtn.disabled = false;
                    submitBtn.textContent = '📝 提交答案';
                } else {
                    submitBtn.disabled = true;
                    submitBtn.textContent = `📝 提交答案（还需连${5 - count}对）`;
                }
            }

            function clearSelection() {
                if (selectedLeft) {
                    const el = document.querySelector(`.card[data-id="${selectedLeft}"]`);
                    if (el && !el.classList.contains('matched') && !el.classList.contains('incorrect')) {
                        el.classList.remove('selected');
                    }
                }
                selectedLeft = null;
            }

            function clearDraftMark(leftId) {
                const rightId = draftPairs[leftId];
                // 清除左侧卡片暂存标记
                const leftEl = document.querySelector(`.card[data-id="${leftId}"]`);
                if (leftEl) {
                    leftEl.classList.remove('draft-paired', 'selected');
                    const num = leftEl.querySelector('.draft-number');
                    if (num) num.remove();
                    // 恢复after内容
                    leftEl.style.setProperty('--after-content', '');
                }
                // 清除右侧卡片暂存标记
                if (rightId) {
                    const rightEl = document.querySelector(`.card[data-id="${rightId}"]`);
                    if (rightEl) {
                        rightEl.classList.remove('draft-paired');
                        const num = rightEl.querySelector('.draft-number');
                        if (num) num.remove();
                    }
                    delete draftRightToLeft[rightId];
                }
                delete draftPairs[leftId];
            }

            function setDraftPair(leftId, rightId) {
                // 如果该右侧已被其他左侧暂存，先清除
                if (draftRightToLeft[rightId] && draftRightToLeft[rightId] !== leftId) {
                    clearDraftMark(draftRightToLeft[rightId]);
                }
                // 如果该左侧已有暂存配对，先清除
                if (draftPairs[leftId] && draftPairs[leftId] !== rightId) {
                    clearDraftMark(leftId);
                }
                // 清除选中状态
                clearSelection();
                // 建立暂存
                draftPairs[leftId] = rightId;
                draftRightToLeft[rightId] = leftId;
                draftCounter++;
                const seq = draftCounter;
                // 标记左侧
                const leftEl = document.querySelector(`.card[data-id="${leftId}"]`);
                if (leftEl && !leftEl.classList.contains('matched') && !leftEl.classList.contains('incorrect')) {
                    leftEl.classList.add('draft-paired');
                    leftEl.classList.remove('selected');
                    if (!leftEl.querySelector('.draft-number')) {
                        const span = document.createElement('span');
                        span.className = 'draft-number';
                        span.textContent = seq;
                        leftEl.insertBefore(span, leftEl.firstChild);
                    }
                }
                // 标记右侧
                const rightEl = document.querySelector(`.card[data-id="${rightId}"]`);
                if (rightEl && !rightEl.classList.contains('matched') && !rightEl.classList.contains('incorrect')) {
                    rightEl.classList.add('draft-paired');
                    if (!rightEl.querySelector('.draft-number')) {
                        const span = document.createElement('span');
                        span.className = 'draft-number';
                        span.textContent = seq;
                        rightEl.insertBefore(span, rightEl.firstChild);
                    }
                }
                updateSubmitBtn();
                hintText.textContent = '🔗 连线成功！可继续连线或点击已连线的左侧卡片修改配对';
            }

            function onLeftClick(card) {
                if (gameCompleted || card.classList.contains('matched') || card.classList.contains('incorrect'))
            return;
                startTimer();
                const leftId = card.dataset.id;
                // 如果该左侧已有暂存配对，取消暂存
                if (draftPairs[leftId]) {
                    clearDraftMark(leftId);
                    clearSelection();
                    updateSubmitBtn();
                    hintText.textContent = '💡 已取消连线，请重新点击左侧情境卡片进行配对';
                    return;
                }
                // 如果已选中该卡片，取消选中
                if (selectedLeft === leftId) {
                    clearSelection();
                    hintText.textContent = '💡 已取消选择，请重新点击左侧情境卡片';
                    return;
                }
                // 选中
                clearSelection();
                selectedLeft = leftId;
                card.classList.add('selected');
                hintText.textContent = '👆 已选中左侧情境，现在请点击右侧对应的方法卡片';
            }

            function onRightClick(card) {
                if (gameCompleted || card.classList.contains('matched') || card.classList.contains('incorrect'))
            return;
                if (!selectedLeft) {
                    hintText.textContent = '⚠️ 请先点击左侧的评估情境卡片哦~';
                    card.classList.add('wrong-flash');
                    setTimeout(() => card.classList.remove('wrong-flash'), 500);
                    return;
                }
                startTimer();
                const leftId = selectedLeft;
                const rightId = card.dataset.id;
                // 建立暂存配对
                setDraftPair(leftId, rightId);
            }

            function bindCardEvents() {
                document.querySelectorAll('.left-card').forEach(card => {
                    card.removeEventListener('click', leftClickHandler);
                    card.removeEventListener('touchend', leftTouchHandler);
                    card.addEventListener('click', leftClickHandler);
                    card.addEventListener('touchend', leftTouchHandler);
                });
                document.querySelectorAll('.right-card').forEach(card => {
                    card.removeEventListener('click', rightClickHandler);
                    card.removeEventListener('touchend', rightTouchHandler);
                    card.addEventListener('click', rightClickHandler);
                    card.addEventListener('touchend', rightTouchHandler);
                });
            }

            function leftClickHandler(e) { onLeftClick(e.currentTarget); }

            function leftTouchHandler(e) { e.preventDefault();
                onLeftClick(e.currentTarget); }

            function rightClickHandler(e) { onRightClick(e.currentTarget); }

            function rightTouchHandler(e) { e.preventDefault();
                onRightClick(e.currentTarget); }

            // ---------- 提交答案 ----------
            function submitAnswers() {
                if (gameCompleted) return;
                if (getDraftCount() < 5) return;
                stopTimer();
                gameCompleted = true;
                score = 0;
                correctCount = 0;
                // 清除所有暂存标记，根据正确与否重新标记
                const allLeftIds = Object.keys(draftPairs);
                allLeftIds.forEach(leftId => {
                    const rightId = draftPairs[leftId];
                    const leftEl = document.querySelector(`.card[data-id="${leftId}"]`);
                    const rightEl = document.querySelector(`.card[data-id="${rightId}"]`);
                    // 清除暂存标记
                    if (leftEl) {
                        leftEl.classList.remove('draft-paired', 'selected');
                        const dn = leftEl.querySelector('.draft-number');
                        if (dn) dn.remove();
                    }
                    if (rightEl) {
                        rightEl.classList.remove('draft-paired');
                        const dn = rightEl.querySelector('.draft-number');
                        if (dn) dn.remove();
                    }
                    // 判断正确
                    if (correctMap[leftId] === rightId && !matchedRightIds.has(rightId)) {
                        correctCount++;
                        score += 20;
                        matchedPairs[leftId] = rightId;
                        matchedRightIds.add(rightId);
                        if (leftEl) {
                            leftEl.classList.add('matched');
                            if (!leftEl.querySelector('.match-number')) {
                                const span = document.createElement('span');
                                span.className = 'match-number';
                                span.textContent = correctCount;
                                leftEl.insertBefore(span, leftEl.firstChild);
                            }
                        }
                        if (rightEl) {
                            rightEl.classList.add('matched');
                            if (!rightEl.querySelector('.match-number')) {
                                const span = document.createElement('span');
                                span.className = 'match-number';
                                span.textContent = correctCount;
                                rightEl.insertBefore(span, rightEl.firstChild);
                            }
                        }
                    } else {
                        if (leftEl) leftEl.classList.add('incorrect');
                        if (rightEl) rightEl.classList.add('incorrect');
                    }
                });
                scoreEl.textContent = score;
                updateSubmitBtn();
                hintText.textContent = '📊 提交完成！绿色为正确，红色为错误。点击下方按钮可查看答案或重新开始';
                setTimeout(showCompletion, 700);
            }

            function showCompletion() {
                document.getElementById('finalScore').textContent = score;
                document.getElementById('finalTime').textContent = formatTime(timerSeconds);
                document.getElementById('finalCorrect').textContent = correctCount + '/5';
                let trophy, title, badge;
                if (correctCount === 5) {
                    trophy = '🏆';
                    title = '完美通关！';
                    badge = '⭐ 社区最佳侦探 ⭐';
                } else if (correctCount === 4) {
                    trophy = '🌟';
                    title = '非常出色！';
                    badge = '优秀社区健康侦探';
                } else if (correctCount === 3) {
                    trophy = '👍';
                    title = '表现不错！';
                    badge = '合格社区健康侦探';
                } else if (correctCount === 2) {
                    trophy = '📚';
                    title = '还需加油！';
                    badge = '继续学习，再接再厉';
                } else {
                    trophy = '💪';
                    title = '别灰心！';
                    badge = '建议复习评估方法哦';
                }
                document.getElementById('trophyEmoji').textContent = trophy;
                document.getElementById('completionTitle').textContent = title;
                document.getElementById('badgeName').textContent = badge;
                completionOverlay.classList.add('show');
            }

            function closeCompletion() { completionOverlay.classList.remove('show'); }

            // ---------- 重置 ----------
            function resetGame() {
                stopTimer();
                clearSelection();
                draftPairs = {};
                draftRightToLeft = {};
                matchedPairs = {};
                matchedRightIds = new Set();
                score = 0;
                correctCount = 0;
                timerSeconds = 0;
                gameStarted = false;
                gameCompleted = false;
                draftCounter = 0;
                timerEl.textContent = '00:00';
                scoreEl.textContent = '0';
                draftCountEl.textContent = '0';
                closeCompletion();
                document.querySelectorAll('.card').forEach(card => {
                    card.classList.remove('selected', 'draft-paired', 'matched', 'incorrect',
                    'wrong-flash');
                    const nums = card.querySelectorAll('.draft-number, .match-number');
                    nums.forEach(n => n.remove());
                });
                hintText.textContent = '💡 先点击左侧情境卡片，再点击右侧方法卡片进行连线（提交前可随时修改）';
                updateSubmitBtn();
                renderShuffledColumns();
            }

            // ---------- 查看答案 ----------
            function showAllAnswers() {
                if (gameCompleted && correctCount === 5) {
                    hintText.textContent = '📖 您已全部正确配对，这就是正确答案哦~';
                    return;
                }
                resetGame();
                stopTimer();
                gameCompleted = true;
                draftCounter = 0;
                const order = [
                    { left: 'L1', right: 'R1' },
                    { left: 'L2', right: 'R2' },
                    { left: 'L3', right: 'R3' },
                    { left: 'L4', right: 'R4' },
                    { left: 'L5', right: 'R5' }
                ];
                correctCount = 0;
                score = 0;
                matchedPairs = {};
                matchedRightIds = new Set();
                order.forEach((pair, idx) => {
                    correctCount = idx + 1;
                    score += 20;
                    matchedPairs[pair.left] = pair.right;
                    matchedRightIds.add(pair.right);
                    const leftEl = document.querySelector(`.card[data-id="${pair.left}"]`);
                    const rightEl = document.querySelector(`.card[data-id="${pair.right}"]`);
                    const span = document.createElement('span');
                    span.className = 'match-number';
                    span.textContent = correctCount;
                    if (leftEl && !leftEl.querySelector('.match-number')) {
                        leftEl.classList.add('matched');
                        leftEl.insertBefore(span.cloneNode(true), leftEl.firstChild);
                    }
                    if (rightEl && !rightEl.querySelector('.match-number')) {
                        rightEl.classList.add('matched');
                        rightEl.insertBefore(span.cloneNode(true), rightEl.firstChild);
                    }
                });
                scoreEl.textContent = score;
                draftCountEl.textContent = '5';
                updateSubmitBtn();
                hintText.textContent = '📖 已显示全部正确答案，请认真学习哦~';
                setTimeout(showCompletion, 500);
            }

            // ---------- QR ----------
            let qrCodeInstance = null;

            function getDefaultURL() { return window.location.href.startsWith('file://') ? '' : window.location
                .href; }

            function updateQRCode() {
                if (qrCodeInstance) { qrCodeInstance.clear();
                    qrCodeInstance = null; }
                document.getElementById('qrContainer').innerHTML = '';
                let url = document.getElementById('qrUrlInput').value.trim();
                if (!url) url = getDefaultURL();
                if (!url) {
                    document.getElementById('qrContainer').innerHTML =
                        '<p style="color:#E0556A;font-size:0.85rem;padding:20px;">⚠️ 当前为本地文件，请部署后输入URL生成二维码</p>';
                    document.getElementById('qrNote').textContent = '💡 提示：可将此HTML上传到GitHub Pages，然后在此输入公开访问的URL';
                    document.getElementById('qrNote').className = 'qr-note warning';
                    return;
                }
                if (!url.startsWith('http://') && !url.startsWith('https://')) {
                    document.getElementById('qrContainer').innerHTML =
                        '<p style="color:#E0556A;font-size:0.85rem;padding:20px;">⚠️ URL需要以 http:// 或 https:// 开头</p>';
                    document.getElementById('qrNote').textContent = '请检查URL格式';
                    document.getElementById('qrNote').className = 'qr-note warning';
                    return;
                }
                try {
                    qrCodeInstance = new QRCode(document.getElementById('qrContainer'), {
                        text: url,
                        width: 180,
                        height: 180,
                        colorDark: '#2D3436',
                        colorLight: '#FFFFFF',
                        correctLevel: QRCode.CorrectLevel.M
                    });
                    document.getElementById('qrNote').textContent = '✅ 扫描二维码即可在手机上打开游戏';
                    document.getElementById('qrNote').className = 'qr-note';
                } catch (e) {
                    document.getElementById('qrContainer').innerHTML =
                        '<p style="color:#E0556A;font-size:0.85rem;padding:20px;">⚠️ 二维码生成失败</p>';
                    document.getElementById('qrNote').textContent = '生成出错，请重试';
                    document.getElementById('qrNote').className = 'qr-note warning';
                }
            }

            function initQR() {
                const defaultUrl = getDefaultURL();
                if (defaultUrl) {
                    document.getElementById('qrUrlInput').value = defaultUrl;
                    updateQRCode();
                } else {
                    document.getElementById('qrContainer').innerHTML =
                        '<p style="color:#999;font-size:0.84rem;padding:20px;">📤 请将此页面部署到服务器<br>或输入公开访问的URL</p>';
                    document.getElementById('qrNote').textContent = '💡 部署后在此输入URL即可生成二维码';
                    document.getElementById('qrNote').className = 'qr-note';
                }
            }

            function init() {
                renderShuffledColumns();
                updateSubmitBtn();
                setTimeout(initQR, 300);
            }
            window.resetGame = resetGame;
            window.showAllAnswers = showAllAnswers;
            window.submitAnswers = submitAnswers;
            window.closeCompletion = closeCompletion;
            window.updateQRCode = updateQRCode;
            document.addEventListener('keydown', (e) => {
                if (e.key === 'r' && e.ctrlKey) { e.preventDefault();
                    resetGame(); }
                if (e.key === 'Escape') {
                    clearSelection();
                    hintText.textContent = '💡 已取消选择，请重新点击左侧情境卡片';
                }
            });
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
